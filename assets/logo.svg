<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Raphaella Martins · Endoscopia Veterinária
       Anel = cabo do endoscópio, com a ponta iluminada · centro = patinha -->
  <defs>
    <radialGradient id="luz" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#BFE2FF"/>
      <stop offset=".55" stop-color="#7DBDF5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7DBDF5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cabo -->
  <path d="M73.5 107.2A49 49 0 1 1 107.2 73.5" fill="none" stroke="#174A8B" stroke-width="8" stroke-linecap="round"/>
  <path d="M73.5 107.2A49 49 0 1 1 107.2 73.5" fill="none" stroke="#3F86D2" stroke-width="2" stroke-linecap="round" stroke-dasharray="0 14" opacity=".9"/>

  <!-- ponta iluminada -->
  <circle cx="102" cy="90.5" r="16" fill="url(#luz)"/>
  <circle cx="105.9" cy="78.2" r="6.6" fill="#174A8B"/>
  <circle cx="105.9" cy="78.2" r="2.8" fill="#CFE9FF"/>

  <!-- patinha -->
  <g fill="#2F74C4" transform="translate(27 26.5) scale(.66)">
    <path d="M50 48C62 48 70 58 76 68C82 78 80 90 69 90C61 90 57 85 50 85C43 85 39 90 31 90C20 90 18 78 24 68C30 58 38 48 50 48Z"/>
    <ellipse cx="36" cy="28" rx="8.5" ry="11.5" transform="rotate(-12 36 28)"/>
    <ellipse cx="64" cy="28" rx="8.5" ry="11.5" transform="rotate(12 64 28)"/>
    <ellipse cx="17" cy="47" rx="7.5" ry="10" transform="rotate(-38 17 47)"/>
    <ellipse cx="83" cy="47" rx="7.5" ry="10" transform="rotate(38 83 47)"/>
  </g>
</svg>
